name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Python and database checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: agent_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agent_user -d agent_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"
      DB_NAME: agent_db
      DB_USER: agent_user
      DB_PASSWORD: ci_password
      LANGSMITH_TRACING: "false"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Check Python syntax
        run: python -m compileall -q app main.py evals tests

      - name: Check for critical Python errors
        run: ruff check app main.py evals --select E9,F63,F7,F82

      - name: Seed temporary database
        run: python -m app.db.seed

      - name: Run Database Test
        run: python -m unittest discover -s tests -p "test_*.py" -v
  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4

      - name: Check formatting
        run: terraform -chdir=infra fmt -check -recursive

      - name: Initialize providers without a backend
        run: terraform -chdir=infra init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        run: terraform -chdir=infra validate

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build --tag enterprise-agent-api:ci .
